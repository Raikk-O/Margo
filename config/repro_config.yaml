fault_injection:
  iterations: 100
  iterations_eval: 10
  iterations_multiclass_eval: 20
fault_rates:
  trajectory: [1e-7, 3e-7, 5e-7, 7e-7, 1e-6]
  multiclass: [1e-5, 3e-5, 5e-5, 1e-4, 3e-4]
  eval_default: [3e-5]
quantization:
  total_bits: 32
  n_frac: 16
  n_int: 15
gabo:
  max_iter: 100
  patience: 6
  max_samples: 2048
  protect_ratio: 0.9
  initial_lr_factor: 0.2
  scale_factor: 2
  dynamic_range_factor: 1.0
  trajectory_max_iter: 100
  trajectory_max_samples: 2048
  trajectory_protect_ratio: 0.5
sac:
  episodes: 50
  steps_per_episode: 5
  sac_lr: 3e-4
  sac_batch_size: 64
  sac_updates_per_step: 2
  n_fault_trials: 5
  eval_samples: 2048
calibration_samples:
  gabo_max_samples: 2048
  sac_eval_samples: 2048
